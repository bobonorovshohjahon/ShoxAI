<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shax World 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial}
#game{width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:white}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-weight:bold;text-shadow:2px 2px 4px #000}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;text-shadow:1px 1px 3px #000}
#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#0008;padding:9px 13px;border-radius:10px;font-size:12px;text-align:center}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:5}
#start button{font-size:20px;padding:14px 25px;border:0;border-radius:12px;background:#65b741;color:white;font-weight:bold}
#joy{position:fixed;bottom:55px;left:28px;width:125px;height:125px;border-radius:50%;background:#ffffff22;border:2px solid #fff5;display:none;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#ffffff66}
#mobile{position:fixed;right:25px;bottom:32px;display:none;gap:12px;pointer-events:auto}
.mbtn{width:58px;height:58px;border:1px solid #fff6;border-radius:15px;background:#111b;color:#fff;font-size:25px;font-weight:bold}
#look{position:fixed;inset:70px 0 170px 150px;display:none;pointer-events:auto;touch-action:none}
#hotbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px}
.slot{width:42px;height:42px;border:2px solid #777;background:#222b;display:grid;place-items:center;font-size:20px}
.slot.sel{border-color:#fff;background:#ffffff44}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="title">SHAX WORLD 3D</div>
<div id="cross">+</div>
<div id="hint">WASD — yurish · Sichqoncha — qarash · Chap bosish — blok buzish · O‘ng bosish — blok qo‘yish</div>
</div>
<div id="start"><button id="play">▶ O‘yinni boshlash</button></div>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>
<div id="mobile">
<button class="mbtn" id="break">⛏</button>
<button class="mbtn" id="jump">↑</button>
<button class="mbtn" id="place">＋</button>
</div>
<div id="hotbar">
<div class="slot sel">🌿</div><div class="slot">🟫</div><div class="slot">🪨</div><div class="slot">🪵</div><div class="slot">🟨</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

const canvas=document.getElementById("game");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight,false);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.domElement.style.width="100%";
renderer.domElement.style.height="100%";
renderer.shadowMap.enabled=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,35,115);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
camera.position.set(0,3,7);

scene.add(new THREE.HemisphereLight(0xbfe7ff,0x5d4b35,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(25,45,15); sun.castShadow=true; scene.add(sun);

const mats={
 grass:new THREE.MeshLambertMaterial({color:0x55a63a}),
 dirt:new THREE.MeshLambertMaterial({color:0x8a5a35}),
 stone:new THREE.MeshLambertMaterial({color:0x858585}),
 wood:new THREE.MeshLambertMaterial({color:0x8b5a2b}),
 leaves:new THREE.MeshLambertMaterial({color:0x2e8b45}),
 sand:new THREE.MeshLambertMaterial({color:0xd9c27a})
};
const geo=new THREE.BoxGeometry(1,1,1);
const blocks=new Map();

function key(x,y,z){return `${x}|${y}|${z}`}
function addBlock(x,y,z,type){
 if(blocks.has(key(x,y,z)))return;
 const m=new THREE.Mesh(geo,mats[type]||mats.grass);
 m.position.set(x,y,z); m.castShadow=true;m.receiveShadow=true;
 m.userData={x,y,z,type};scene.add(m);blocks.set(key(x,y,z),m);
}
function removeBlock(m){scene.remove(m);blocks.delete(key(m.userData.x,m.userData.y,m.userData.z));}

function world(){
 for(let x=-18;x<=18;x++)for(let z=-18;z<=18;z++){
  const h=1+Math.floor((Math.sin(x*.35)+Math.cos(z*.32)+2)*.45);
  for(let y=-1;y<=h;y++)addBlock(x,y,z,y===h?"grass":y>-2?"dirt":"stone");
 }
 for(let i=0;i<18;i++){
  const x=Math.floor(Math.random()*31)-15,z=Math.floor(Math.random()*31)-15;
  const y=3;
  for(let j=0;j<3;j++)addBlock(x,y+j,z,"wood");
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=3;dy++)
    if(Math.abs(dx)+Math.abs(dz)<4)addBlock(x+dx,y+dy,z+dz,"leaves");
 }
}
world();

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let yaw=0,pitch=-.15,locked=false;
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if(isMobile){
 document.getElementById("joy").style.display="block";
 document.getElementById("mobile").style.display="flex";
 document.getElementById("look").style.display="block";
 document.getElementById("hint").textContent="Chap doira — yurish · O‘ng tomon — qarash · ⛏ — buzish · ＋ — qo‘yish · ↑ — sakrash";
}
document.getElementById("play").onclick=()=>{
 document.getElementById("start").style.display="none";
 canvas.requestPointerLock?.();
};
document.addEventListener("pointerlockchange",()=>locked=document.pointerLockElement===canvas);
document.addEventListener("mousemove",e=>{
 if(!locked)return;
 yaw-=e.movementX*.0025;
 pitch-=e.movementY*.0025;
 pitch=Math.max(-1.45,Math.min(1.45,pitch));
});

const ray=new THREE.Raycaster();
function target(){
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects([...blocks.values()]);
 return hits[0];
}
addEventListener("mousedown",e=>{
 if(!locked)return;
 const h=target();if(!h)return;
 if(e.button===0)removeBlock(h.object);
 if(e.button===2){
  const n=h.face.normal;
  const p=h.object.position.clone().add(n);
  addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),"grass");
 }
});
addEventListener("contextmenu",e=>e.preventDefault());

function doBreak(){const h=target();if(h)removeBlock(h.object)}
function doPlace(){const h=target();if(!h)return;const n=h.face.normal,p=h.object.position.clone().add(n);addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),"grass")}
document.getElementById("break").addEventListener("touchstart",e=>{e.preventDefault();doBreak()},{passive:false});
document.getElementById("place").addEventListener("touchstart",e=>{e.preventDefault();doPlace()},{passive:false});
document.getElementById("jump").addEventListener("touchstart",e=>{e.preventDefault();if(onGround)velocityY=.22},{passive:false});

let joyActive=false,joyId=null;
const joy=document.getElementById("joy"),stick=document.getElementById("stick");
joy.addEventListener("touchstart",e=>{e.preventDefault();joyActive=true;joyId=e.changedTouches[0].identifier},{passive:false});
joy.addEventListener("touchmove",e=>{
 if(!joyActive)return;e.preventDefault();
 const t=[...e.touches].find(x=>x.identifier===joyId);if(!t)return;
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=t.clientX-cx,dy=t.clientY-cy,len=Math.hypot(dx,dy),max=42;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 stick.style.left=(36+dx)+"px";stick.style.top=(36+dy)+"px";
 keys.w=dy<-10;keys.s=dy>10;keys.a=dx<-10;keys.d=dx>10;
},{passive:false});
joy.addEventListener("touchend",()=>{joyActive=false;stick.style.left="36px";stick.style.top="36px";keys.w=keys.s=keys.a=keys.d=false});

const look=document.getElementById("look");
let lastX,lastY;
look.addEventListener("touchstart",e=>{const t=e.touches[0];lastX=t.clientX;lastY=t.clientY},{passive:true});
look.addEventListener("touchmove",e=>{
 const t=e.touches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;
 yaw-=dx*.006;pitch-=dy*.006;pitch=Math.max(-1.45,Math.min(1.45,pitch));
},{passive:true});

let velocityY=0,onGround=false;
function player(){
 const dir=new THREE.Vector3();
 if(keys.w)dir.z-=1;if(keys.s)dir.z+=1;if(keys.a)dir.x-=1;if(keys.d)dir.x+=1;
 if(dir.length()){dir.normalize();const c=Math.cos(yaw),s=Math.sin(yaw);
  const x=dir.x*c-dir.z*s,z=dir.x*s+dir.z*c;
  camera.position.x+=x*.105;camera.position.z+=z*.105;
 }
 velocityY-=.012;camera.position.y+=velocityY;
 if(camera.position.y<2.2){camera.position.y=2.2;velocityY=0;onGround=true}else onGround=false;
 if(keys[" "]&&onGround)velocityY=.22;
 camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;
}
function resize(){
 const maxW=1280,maxH=720,scale=Math.min(1,maxW/innerWidth,maxH/innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25)*scale);
 renderer.setSize(innerWidth,innerHeight,false);
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
}
resize();
addEventListener("resize",resize);

function loop(){
 requestAnimationFrame(loop);player();renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
