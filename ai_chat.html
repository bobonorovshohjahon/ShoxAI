<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — Ochiq AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff;height:100vh}
.app{height:100vh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:#11182d}
header{padding:18px 20px;border-bottom:1px solid #26304d;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#5b5cff,#00c6ff);display:grid;place-items:center;font-weight:bold}
h1{font-size:18px;margin:0}
small{color:#9da8c7}
#chat{flex:1;overflow:auto;padding:22px}
.msg{max-width:80%;padding:13px 16px;border-radius:16px;margin:10px 0;line-height:1.5;white-space:pre-wrap}
.user{margin-left:auto;background:#3159d8}
.ai{background:#202943;border:1px solid #303b5e}
.input{padding:15px;border-top:1px solid #26304d;display:flex;gap:10px}
input{flex:1;padding:14px;border:1px solid #364262;border-radius:12px;background:#0c1326;color:white;outline:none}
button{border:0;border-radius:12px;padding:0 20px;background:#5b5cff;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#7071ff}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">AI</div>
  <div><h1>AI Chat</h1><small>Oddiy AI suhbat interfeysi</small></div>
</header>

<div id="chat">
  <div class="msg ai">Salom! Men AI yordamchi interfeysiman. Savolingizni yozing.</div>
</div>

<div class="input">
  <input id="input" placeholder="Xabaringizni yozing..." autocomplete="off">
  <button onclick="send()">Yuborish</button>
</div>
</div>

<script>
const input=document.getElementById("input");
const chat=document.getElementById("chat");

function add(text, cls){
  const el=document.createElement("div");
  el.className="msg "+cls;
  el.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
}

function send(){
  const text=input.value.trim();
  if(!text)return;
  add(text,"user");
  input.value="";
  setTimeout(()=>add(getAI(text),"ai"),400);
}

function getAI(text){
  const t=text.toLowerCase();

  if(t.includes("salom")) return "Salom! Qanday yordam beray?";
  if(t.includes("isming")) return "Men AI Chat yordamchisiman.";
  if(t.includes("html")) return "HTML fayl yaratish, kod yozish va sahifa dizaynini tuzishda yordam bera olaman.";
  if(t.includes("rahmat")) return "Arzimaydi! 😊";
  return "Savolingizni qabul qildim. Bu demo AI chat bo‘lib, javoblar JavaScript ichidagi oddiy qoidalar asosida beriladi.";
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")send();
});
</script>
</body>
</html>
